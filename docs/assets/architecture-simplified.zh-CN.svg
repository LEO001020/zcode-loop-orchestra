<svg id="zloop-simple-zh" xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">ZCode LOOP Orchestra 简化架构</title>
  <desc id="desc">ZCode 负责理解目标，ZLoop 负责保存状态、调度隔离的执行 Agent、检查真实改动、安排独立复核和失败恢复，最终由人决定是否合并。</desc>
  <defs>
    <linearGradient id="simple-glow-zh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="simple-blue-zh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="simple-violet-zh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f0ff"/>
    </linearGradient>
    <filter id="simple-shadow-zh" x="-18%" y="-24%" width="136%" height="166%">
      <feDropShadow dx="0" dy="10" stdDeviation="17" flood-color="#7a8492" flood-opacity=".12"/>
    </filter>
    <marker id="simple-arrow-zh" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#8f98a5"/>
    </marker>
  </defs>
  <style>
    #zloop-simple-zh{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif}
    .page{fill:#f7f7f5}.decor{fill:url(#simple-glow-zh)}
    .title{fill:#151619;font-size:42px;font-weight:500;letter-spacing:-1.3px}
    .subtitle{fill:#666a73;font-size:17px;font-weight:400}
    .eyebrow{fill:#989da6;font-size:12px;font-weight:500;letter-spacing:1.8px}
    .stage{fill:#989da6;font-size:13px;font-weight:500;letter-spacing:1.4px}
    .node-title{fill:#151619;font-size:18px;font-weight:500;letter-spacing:-.25px}
    .node-sub{fill:#5d626b;font-size:12.5px;font-weight:400}
    .section-note{fill:#5d626b;font-size:14px;font-weight:500}
    .foot{fill:#8e959f;font-size:11px;font-weight:400}
    .box{fill:#fff;stroke:#d9dce1;stroke-width:1.1;filter:url(#simple-shadow-zh)}
    .blue-card{fill:url(#simple-blue-zh);stroke:#b9d6ff;stroke-width:1.2;filter:url(#simple-shadow-zh)}
    .green-card{fill:#fff;stroke:#c3e9d2;stroke-width:1.2;filter:url(#simple-shadow-zh)}
    .amber-card{fill:#fff;stroke:#edd49a;stroke-width:1.2;filter:url(#simple-shadow-zh)}
    .violet-card{fill:url(#simple-violet-zh);stroke:#d6c8fa;stroke-width:1.2;filter:url(#simple-shadow-zh)}
    .connector{fill:none;stroke:#8f98a5;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#simple-arrow-zh)}
    .hairline{stroke:#d9dce1;stroke-width:1}
  </style>

  <rect class="page" width="1600" height="1220"/>
  <circle class="decor" cx="1502" cy="22" r="252" opacity=".65"/>
  <circle class="decor" cx="110" cy="1160" r="210" opacity=".45"/>

  <text class="eyebrow" x="72" y="54">SYSTEM ARCHITECTURE  /  SIMPLIFIED VIEW</text>
  <text class="title" x="72" y="96">ZCode LOOP Orchestra</text>
  <text class="subtitle" x="72" y="127">让长时间的 AI 编程任务拥有持久记忆、并行 Agent、可靠检查和中断恢复。</text>

  <line class="hairline" x1="165" y1="198" x2="165" y2="1116"/>
  <circle cx="165" cy="212" r="4" fill="#8f98a5"/>
  <text class="stage" x="78" y="218">目标</text>
  <text class="stage" x="78" y="405">计划</text>
  <text class="stage" x="78" y="624">工作</text>
  <text class="stage" x="78" y="847">检查</text>
  <text class="stage" x="78" y="1056">合并</text>

  <rect class="box" x="250" y="168" rx="24" width="575" height="92"/>
  <text class="node-title" x="278" y="210">用户目标</text>
  <text class="node-sub" x="278" y="238">工程目标、项目目录、约束和完成标准</text>

  <rect class="blue-card" x="858" y="168" rx="24" width="492" height="92"/>
  <text class="node-title" x="886" y="210">主 ZCode Agent</text>
  <text class="node-sub" x="886" y="238">理解问题、制定计划并处理真正的不确定问题</text>

  <path class="connector" d="M800 286V320"/>
  <text class="section-note" x="800" y="306" text-anchor="middle">↓ 一次规划，把目标变成可以独立执行的任务</text>

  <rect class="amber-card" x="250" y="355" rx="24" width="350" height="118"/>
  <text class="node-title" x="278" y="405">任务依赖图</text>
  <text class="node-sub" x="278" y="434">任务目标、前置关系和允许修改的文件</text>

  <rect class="amber-card" x="625" y="355" rx="24" width="350" height="118"/>
  <text class="node-title" x="653" y="405">自动调度任务</text>
  <text class="node-sub" x="653" y="434">任务准备好就启动；常规重试由程序处理</text>

  <rect class="amber-card" x="1000" y="355" rx="24" width="350" height="118"/>
  <text class="node-title" x="1028" y="405">持久记忆</text>
  <text class="node-sub" x="1028" y="434">事件、检查点和证据保存在对话之外</text>

  <path class="connector" d="M800 500V536"/>
  <text class="section-note" x="800" y="522" text-anchor="middle">↓ 每个 Agent 使用独立工作区；迟到结果不能覆盖新计划</text>

  <rect class="green-card" x="250" y="573" rx="24" width="538" height="110"/>
  <text class="node-title" x="278" y="623">隔离的执行 Agent</text>
  <text class="node-sub" x="278" y="652">并行完成边界明确的工程任务，不直接修改主分支</text>

  <rect class="green-card" x="812" y="573" rx="24" width="538" height="110"/>
  <text class="node-title" x="840" y="623">保留来源的研究 Agent</text>
  <text class="node-sub" x="840" y="652">单独查找外部资料，并记录来源和时间</text>

  <path class="connector" d="M800 708V744"/>
  <text class="section-note" x="800" y="730" text-anchor="middle">↓ 检查真实改动，而不是相信一句“我完成了”</text>

  <rect class="violet-card" x="250" y="781" rx="24" width="350" height="126"/>
  <text class="node-title" x="278" y="831">重新检查真实结果</text>
  <text class="node-sub" x="278" y="860">实际改动、允许范围、测试和运行结果</text>

  <rect class="violet-card" x="625" y="781" rx="24" width="350" height="126"/>
  <text class="node-title" x="653" y="831">独立模型审查</text>
  <text class="node-sub" x="653" y="860">可要求重做或上报风险，但不能发布</text>

  <rect class="violet-card" x="1000" y="781" rx="24" width="350" height="126"/>
  <text class="node-title" x="1028" y="831">失败恢复</text>
  <text class="node-sub" x="1028" y="860">坏候选恢复到已知状态，证据继续保留</text>

  <path class="connector" d="M800 934V969"/>

  <rect class="blue-card" x="250" y="992" rx="26" width="1100" height="126"/>
  <text class="node-title" x="280" y="1042">人工确认后最终合并</text>
  <text class="node-sub" x="280" y="1071">所有检查通过后，仍由人决定候选结果是否进入主分支；任何 Agent 都没有发布权限。</text>

  <line class="hairline" x1="72" y1="1158" x2="1528" y2="1158"/>
  <text class="foot" x="72" y="1186">主 Agent 负责决策，ZLoop 保存状态并调度任务，多个 Agent 分开工作，真实检查与独立模型负责审查，最终由人合并。</text>
</svg>
