<svg id="zloop-overview-zh" xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">ZCode LOOP Orchestra 完整架构</title>
  <desc id="desc">从用户目标到人工合并：主 ZCode Agent 负责判断，ZLoop 保存状态和调度任务，执行 Agent 在独立工作区并行工作，真实证据与独立模型复核结果，最终由人发布。</desc>
  <defs>
    <linearGradient id="overview-glow-zh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="overview-blue-zh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="overview-violet-zh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f0ff"/>
    </linearGradient>
    <filter id="overview-shadow-zh" x="-18%" y="-24%" width="136%" height="166%">
      <feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#7a8492" flood-opacity=".11"/>
    </filter>
    <marker id="overview-arrow-zh" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#8f98a5"/>
    </marker>
    <marker id="overview-green-arrow-zh" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#168a50"/>
    </marker>
    <marker id="overview-red-arrow-zh" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#c5413a"/>
    </marker>
  </defs>
  <style>
    #zloop-overview-zh{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif}
    .page{fill:#f7f7f5}.decor{fill:url(#overview-glow-zh)}
    .title{fill:#151619;font-size:42px;font-weight:500;letter-spacing:-1.4px}
    .subtitle{fill:#666a73;font-size:17px;font-weight:400}
    .eyebrow{fill:#989da6;font-size:12px;font-weight:500;letter-spacing:1.8px}
    .promise-title{fill:#151619;font-size:17px;font-weight:500}
    .promise-sub{fill:#7d848e;font-size:11.5px;font-weight:400}
    .stage{fill:#989da6;font-size:11px;font-weight:500;letter-spacing:1.7px}
    .node-title{fill:#151619;font-size:18px;font-weight:500;letter-spacing:-.25px}
    .node-sub{fill:#60656e;font-size:12px;font-weight:400}
    .node-note{fill:#8d949e;font-size:10.8px;font-weight:400}
    .chip-text{font-size:10px;font-weight:500;letter-spacing:.3px}
    .small{fill:#60656e;font-size:10.5px;font-weight:400}
    .foot{fill:#8d949e;font-size:10.5px;font-weight:400}
    .box{fill:#fff;stroke:#d9dce1;stroke-width:1.1;filter:url(#overview-shadow-zh)}
    .blue-card{fill:url(#overview-blue-zh);stroke:#b9d6ff;stroke-width:1.2;filter:url(#overview-shadow-zh)}
    .green-card{fill:#fff;stroke:#c3e9d2;stroke-width:1.2;filter:url(#overview-shadow-zh)}
    .amber-card{fill:#fff;stroke:#edd49a;stroke-width:1.2;filter:url(#overview-shadow-zh)}
    .violet-card{fill:url(#overview-violet-zh);stroke:#d6c8fa;stroke-width:1.2;filter:url(#overview-shadow-zh)}
    .red-card{fill:#fff;stroke:#f0beb9;stroke-width:1.2;filter:url(#overview-shadow-zh)}
    .connector{fill:none;stroke:#8f98a5;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#overview-arrow-zh)}
    .connector-soft{fill:none;stroke:#d9dce1;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
    .connector-green{fill:none;stroke:#168a50;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#overview-green-arrow-zh)}
    .connector-red{fill:none;stroke:#c5413a;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#overview-red-arrow-zh);stroke-dasharray:6 7}
    .hairline{stroke:#d9dce1;stroke-width:1}
    .blue-text{fill:#1267e5}.green-text{fill:#168a50}.violet-text{fill:#7651c9}.red-text{fill:#c5413a}
  </style>

  <rect class="page" width="1600" height="1320"/>
  <circle class="decor" cx="1492" cy="8" r="260" opacity=".65"/>
  <circle class="decor" cx="94" cy="1260" r="220" opacity=".5"/>

  <text class="eyebrow" x="72" y="54">SYSTEM ARCHITECTURE  /  CONTROL AND RECOVERY</text>
  <text class="title" x="72" y="96">ZCode LOOP Orchestra</text>
  <text class="subtitle" x="72" y="127">把一个目标变成可中断恢复的多 Agent 工作流，最终仍由人确认合并。</text>

  <rect class="box" x="72" y="160" rx="20" width="330" height="84"/>
  <rect x="72" y="160" width="4" height="84" rx="2" fill="#1267e5"/>
  <text class="promise-title" x="96" y="195">持久记忆</text>
  <text class="promise-sub" x="96" y="220">上下文压缩、重启和中断后仍能恢复</text>

  <rect class="box" x="418" y="160" rx="20" width="330" height="84"/>
  <rect x="418" y="160" width="4" height="84" rx="2" fill="#168a50"/>
  <text class="promise-title" x="442" y="195">隔离并行</text>
  <text class="promise-sub" x="442" y="220">多个 Agent 同时工作，但不共用可写目录</text>

  <rect class="box" x="764" y="160" rx="20" width="330" height="84"/>
  <rect x="764" y="160" width="4" height="84" rx="2" fill="#a86d00"/>
  <text class="promise-title" x="788" y="195">真实验收</text>
  <text class="promise-sub" x="788" y="220">看实际差异、文件范围、测试和运行结果</text>

  <rect class="box" x="1110" y="160" rx="20" width="418" height="84"/>
  <rect x="1110" y="160" width="4" height="84" rx="2" fill="#151619"/>
  <text class="promise-title" x="1134" y="195">人工发布</text>
  <text class="promise-sub" x="1134" y="220">任何 Agent 和复核模型都不能自行合并</text>

  <line class="hairline" x1="160" y1="286" x2="160" y2="1254"/>
  <circle cx="160" cy="299" r="4" fill="#8f98a5"/>
  <text class="stage" x="72" y="304">目标</text>
  <text class="stage" x="72" y="400">判断</text>
  <text class="stage" x="72" y="502">计划</text>
  <text class="stage" x="72" y="611">控制</text>
  <text class="stage" x="72" y="728">执行</text>
  <text class="stage" x="72" y="840">证据</text>
  <text class="stage" x="72" y="948">复核</text>
  <text class="stage" x="72" y="1041">集成</text>
  <text class="stage" x="72" y="1124">发布</text>
  <text class="stage" x="72" y="1226">恢复</text>

  <path class="connector" d="M800 338V356"/>
  <path class="connector" d="M800 431V454"/>
  <path class="connector" d="M800 555V575"/>
  <path class="connector" d="M800 681V702"/>
  <path class="connector" d="M800 786V810"/>
  <path class="connector" d="M800 890V914"/>

  <rect class="box" x="220" y="268" rx="22" width="1160" height="70"/>
  <text class="node-title" x="800" y="296" text-anchor="middle">用户工程目标</text>
  <text class="node-sub" x="800" y="319" text-anchor="middle">一个目标进入系统；最终合并与发布仍由人触发。</text>

  <rect class="blue-card" x="220" y="356" rx="24" width="1160" height="75"/>
  <rect x="242" y="371" rx="10" width="122" height="23" fill="#eaf3ff" stroke="#b9d6ff"/>
  <text class="chip-text blue-text" x="303" y="386.5" text-anchor="middle">主 AGENT</text>
  <text class="node-title" x="800" y="384" text-anchor="middle">主 ZCode Agent</text>
  <text class="node-sub" x="800" y="409" text-anchor="middle">理解目标、制定计划、综合证据，并处理真正需要判断的不确定问题</text>

  <rect class="box" x="220" y="454" rx="21" width="558" height="101"/>
  <text class="eyebrow" x="244" y="480">工作计划</text>
  <text class="node-title" x="244" y="510">清晰的工作计划</text>
  <text class="node-sub" x="244" y="535">目标、允许修改的文件、验收方式和风险边界</text>

  <rect class="box" x="822" y="454" rx="21" width="558" height="101"/>
  <text class="eyebrow" x="846" y="480">任务依赖</text>
  <text class="node-title" x="846" y="510">任务依赖图</text>
  <text class="node-sub" x="846" y="535">可以并行的工作同时执行；有前置关系的工作按顺序推进</text>
  <path class="connector-soft" d="M778 504H822"/>

  <rect class="amber-card" x="220" y="575" rx="24" width="1160" height="106"/>
  <text class="node-title" x="800" y="603" text-anchor="middle">自动调度与状态管理</text>
  <text class="node-sub" x="800" y="626" text-anchor="middle">程序持续推进任务并记录发生过什么；模型只处理需要判断的问题。</text>
  <rect x="247" y="643" width="255" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/>
  <text class="small" x="374.5" y="658" text-anchor="middle">保存当前状态</text>
  <rect x="520" y="643" width="255" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/>
  <text class="small" x="647.5" y="658" text-anchor="middle">按依赖启动任务</text>
  <rect x="793" y="643" width="255" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/>
  <text class="small" x="920.5" y="658" text-anchor="middle">普通重试与取消</text>
  <rect x="1066" y="643" width="287" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/>
  <text class="small" x="1209.5" y="658" text-anchor="middle">拒绝迟到或过期的结果</text>

  <rect class="green-card" x="220" y="702" rx="24" width="558" height="84"/>
  <rect x="242" y="717" rx="10" width="126" height="23" fill="#ebf8f0" stroke="#c3e9d2"/>
  <text class="chip-text green-text" x="305" y="732.5" text-anchor="middle">编码 AGENT</text>
  <text class="node-title" x="499" y="742" text-anchor="middle">并行编码 Agent</text>
  <text class="node-sub" x="499" y="765" text-anchor="middle">每项任务使用独立工作区，不直接修改主分支</text>

  <rect class="green-card" x="822" y="702" rx="24" width="558" height="84"/>
  <rect x="844" y="717" rx="10" width="134" height="23" fill="#ebf8f0" stroke="#c3e9d2"/>
  <text class="chip-text green-text" x="911" y="732.5" text-anchor="middle">研究 AGENT</text>
  <text class="node-title" x="1101" y="742" text-anchor="middle">保留来源的研究 Agent</text>
  <text class="node-sub" x="1101" y="765" text-anchor="middle">单独查找外部资料，记录来源，并把网页内容视为不可信输入</text>
  <path class="connector-soft" d="M499 786V810H800"/>
  <path class="connector-soft" d="M1101 786V810H800"/>

  <rect class="box" x="220" y="810" rx="22" width="1160" height="80"/>
  <text class="node-title" x="800" y="838" text-anchor="middle">重新检查真实结果</text>
  <text class="node-sub" x="800" y="862" text-anchor="middle">实际修改的文件 + 允许范围 + 测试 + Git 状态 + 运行结果；不能只相信 Agent 自报完成</text>

  <rect class="violet-card" x="420" y="914" rx="24" width="710" height="76"/>
  <rect x="442" y="929" rx="10" width="106" height="23" fill="#f2edff" stroke="#d6c8fa"/>
  <text class="chip-text violet-text" x="495" y="944.5" text-anchor="middle">审查模型</text>
  <text class="node-title" x="775" y="943" text-anchor="middle">独立模型审查</text>
  <text class="node-sub" x="775" y="968" text-anchor="middle">通过 · 要求重做 · 提出高风险问题；复核模型没有发布权限</text>

  <rect class="red-card" x="1162" y="909" rx="22" width="218" height="86"/>
  <text class="node-title" x="1271" y="940" text-anchor="middle">高风险升级</text>
  <text class="node-sub" x="1271" y="962" text-anchor="middle">只有真正的不确定问题</text>
  <text class="node-note" x="1271" y="979" text-anchor="middle">返回主 Agent 判断</text>
  <path class="connector-red" d="M1130 951H1162"/>
  <text class="small red-text" x="1146" y="938" text-anchor="middle">升级</text>
  <path class="connector-red" d="M420 952H264V744H220"/>
  <text class="small red-text" x="276" y="937">重做</text>

  <path class="connector-green" d="M775 990V1011"/>
  <rect class="green-card" x="220" y="1011" rx="22" width="558" height="72"/>
  <text class="node-title" x="499" y="1040" text-anchor="middle">安全集成区</text>
  <text class="node-sub" x="499" y="1063" text-anchor="middle">把通过检查的改动组合成一个干净候选结果</text>

  <rect class="violet-card" x="822" y="1011" rx="22" width="558" height="72"/>
  <text class="node-title" x="1101" y="1040" text-anchor="middle">最终检查</text>
  <text class="node-sub" x="1101" y="1063" text-anchor="middle">检查候选、仓库状态和发布条件是否仍然一致</text>
  <path class="connector-green" d="M778 1047H822"/>

  <path class="connector-green" d="M1101 1083V1098H800"/>
  <rect class="box" x="420" y="1098" rx="24" width="710" height="66"/>
  <text class="node-title" x="775" y="1125" text-anchor="middle">人工确认后执行最终合并</text>
  <text class="node-sub" x="775" y="1148" text-anchor="middle">这是唯一能够让候选结果进入主分支的权限</text>

  <rect class="box" x="220" y="1190" rx="22" width="558" height="82"/>
  <text class="node-title" x="499" y="1218" text-anchor="middle">持久记忆</text>
  <text class="node-sub" x="499" y="1242" text-anchor="middle">保存已观察事件、精简检查点和证据引用</text>
  <text class="node-note" x="499" y="1261" text-anchor="middle">上下文压缩或重启后仍然存在</text>

  <rect class="violet-card" x="822" y="1190" rx="22" width="558" height="82"/>
  <text class="node-title" x="1101" y="1218" text-anchor="middle">中断恢复与原始记录回查</text>
  <text class="node-sub" x="1101" y="1242" text-anchor="middle">从保存的状态继续，并按事件或证据引用查看原始记录</text>
  <text class="node-note" x="1101" y="1261" text-anchor="middle">始终以当前项目真实状态为准，不盲信旧摘要</text>
  <path class="connector-soft" d="M778 1231H822"/>

  <line class="hairline" x1="72" y1="1293" x2="1528" y2="1293"/>
  <text class="foot" x="72" y="1310">ZCode 负责决策，ZLoop 负责记忆、调度、检查与恢复，多个 Agent 分开工作，最终合并由人决定。</text>
</svg>
