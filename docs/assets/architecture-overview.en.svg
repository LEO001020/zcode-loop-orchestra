<svg id="architecture" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">ZCode LOOP Orchestra architecture</title>
  <desc id="desc">A ZCode-native architecture diagram showing the run, stage, wave, control store, worktree, evidence, materialization, audit, promotion, and recovery flow.</desc>
  <defs>
    <linearGradient id="pageGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1f5"/></linearGradient>
    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="violetWash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f0ff"/></linearGradient>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#7a8492" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#8f98a5"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#168a50"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#c5413a"/></marker>
  </defs>
  <style>
    #architecture{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Roboto,Arial,sans-serif;
      --bg:#f7f7f5;--surface:#ffffff;--surface-2:#f0f1ef;--ink:#151619;--muted:#666a73;--faint:#989da6;
      --line:#d9dce1;--line-strong:#8f98a5;--shadow:#7a8492;
      --blue:#1267e5;--blue-soft:#eaf3ff;--blue-stroke:#b9d6ff;--blue-wash-b:#eef5ff;
      --green:#168a50;--green-soft:#ebf8f0;--green-stroke:#c3e9d2;
      --violet:#7651c9;--violet-soft:#f2edff;--violet-stroke:#d6c8fa;--violet-wash-b:#f4f0ff;
      --amber:#a86d00;--amber-soft:#fff6de;--amber-stroke:#edd49a;
      --red:#c5413a;--red-soft:#fff0ee;--red-stroke:#f0beb9;
    }
    .page{fill:var(--bg)}.decor{fill:url(#pageGlow)}.title{fill:var(--ink);font-size:42px;font-weight:710;letter-spacing:-1.6px}
    .subtitle{fill:var(--muted);font-size:17px;font-weight:430;letter-spacing:-.15px}.eyebrow{fill:var(--faint);font-size:12px;font-weight:700;letter-spacing:1.8px}
    .metric-value{fill:var(--ink);font-size:26px;font-weight:720;letter-spacing:-.8px}.metric-label{fill:var(--muted);font-size:12px;font-weight:610}.metric-sub{fill:var(--faint);font-size:11px;font-weight:460}
    .stage{fill:var(--faint);font-size:11px;font-weight:760;letter-spacing:1.8px}.node-title{fill:var(--ink);font-size:18px;font-weight:690;letter-spacing:-.3px}
    .node-sub{fill:var(--muted);font-size:12.2px;font-weight:460}.node-note{fill:var(--faint);font-size:11px;font-weight:500}.chip-text{font-size:10px;font-weight:750;letter-spacing:.35px}
    .small{fill:var(--muted);font-size:10.5px;font-weight:500}.foot{fill:var(--faint);font-size:10.5px;font-weight:500}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1}.blue-card{fill:url(#blueWash);stroke:var(--blue-stroke);stroke-width:1.2}
    .green-card{fill:var(--surface);stroke:var(--green-stroke);stroke-width:1.2}.violet-card{fill:url(#violetWash);stroke:var(--violet-stroke);stroke-width:1.2}
    .amber-card{fill:var(--surface);stroke:var(--amber-stroke);stroke-width:1.2}.red-card{fill:var(--red-soft);stroke:var(--red-stroke);stroke-width:1.2}
    .connector{fill:none;stroke:var(--line-strong);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .connector-soft{fill:none;stroke:var(--line);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
    .connector-green{fill:none;stroke:var(--green);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
    .connector-red{fill:none;stroke:var(--red);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 7;marker-end:url(#arrowRed)}
    .hairline{stroke:var(--line);stroke-width:1}.metric,.raised{filter:url(#shadowSoft)}.blue-text{fill:var(--blue)}.green-text{fill:var(--green)}
    .violet-text{fill:var(--violet)}.amber-text{fill:var(--amber)}.red-text{fill:var(--red)}
  </style>

  <rect class="page" width="1600" height="1320"/>
  <circle class="decor" cx="1492" cy="8" r="260" opacity=".65"/><circle class="decor" cx="94" cy="1260" r="220" opacity=".5"/>

  <text class="eyebrow" x="72" y="54">SYSTEM ARCHITECTURE / ZCODE LOOP CONTROL</text>
  <text class="title" x="72" y="96">ZCode LOOP Orchestra</text>
  <text class="subtitle" x="72" y="127">A ZCode-native run, wave, evidence, and controlled promotion system for auditable parallel work.</text>

  <g class="metric raised"><rect class="box" x="72" y="160" rx="20" ry="20" width="330" height="84"/><text class="metric-value" x="96" y="199">RUN</text><text class="metric-label" x="166" y="197">durable control record</text><text class="metric-sub" x="96" y="221">SQLite S + lifecycle events</text><rect x="72" y="160" width="4" height="84" rx="2" fill="#1267e5"/></g>
  <g class="metric raised"><rect class="box" x="418" y="160" rx="20" ry="20" width="330" height="84"/><text class="metric-value" x="442" y="199">STAGE</text><text class="metric-label" x="548" y="197">revision-fenced phase</text><text class="metric-sub" x="442" y="221">PLANNING → PROMOTED</text><rect x="418" y="160" width="4" height="84" rx="2" fill="#a86d00"/></g>
  <g class="metric raised"><rect class="box" x="764" y="160" rx="20" ry="20" width="330" height="84"/><text class="metric-value" x="788" y="199">WAVE</text><text class="metric-label" x="900" y="197">cold supervisor</text><text class="metric-sub" x="788" y="221">dependency-aware poll()</text><rect x="764" y="160" width="4" height="84" rx="2" fill="#168a50"/></g>
  <g class="metric raised"><rect class="box" x="1110" y="160" rx="20" ry="20" width="418" height="84"/><text class="metric-value" x="1134" y="199">C2C</text><text class="metric-label" x="1212" y="197">redacted audit packet</text><text class="metric-sub" x="1134" y="221">PREPARE → RECORD</text><rect x="1110" y="160" width="4" height="84" rx="2" fill="#7651c9"/></g>

  <line class="hairline" x1="160" y1="286" x2="160" y2="1254" opacity=".9"/><circle cx="160" cy="299" r="4" fill="#8f98a5"/>
  <text class="stage" x="72" y="304">INPUT</text><text class="stage" x="72" y="400">RUN</text><text class="stage" x="72" y="502">PLAN</text><text class="stage" x="72" y="611">CONTROL</text>
  <text class="stage" x="72" y="728">EXECUTE</text><text class="stage" x="72" y="840">EVIDENCE</text><text class="stage" x="72" y="948">MATERIALIZE</text>
  <text class="stage" x="72" y="1041">AUDIT</text><text class="stage" x="72" y="1124">PROMOTE</text><text class="stage" x="72" y="1226">RECORD</text>

  <path class="connector" d="M800 338 L800 356"/><path class="connector" d="M800 431 L800 454"/><path class="connector" d="M800 555 L800 575"/>
  <path class="connector" d="M800 681 L800 702"/><path class="connector" d="M800 786 L800 810"/><path class="connector" d="M800 890 L800 909"/>
  <path class="connector" d="M800 995 L800 1011"/><path class="connector" d="M800 1083 L800 1098"/><path class="connector" d="M800 1164 L800 1190"/>

  <g class="raised"><rect class="box" x="220" y="268" rx="22" ry="22" width="1160" height="70"/>
    <text class="node-title" x="800" y="296" text-anchor="middle">Developer objective</text>
    <text class="node-sub" x="800" y="319" text-anchor="middle">A project goal enters as a run; the canonical branch remains outside the worker pool.</text>
  </g>

  <g class="raised"><rect class="blue-card" x="220" y="356" rx="24" ry="24" width="1160" height="75"/>
    <rect x="242" y="371" rx="10" ry="10" width="122" height="23" fill="#eaf3ff" stroke="#b9d6ff"/>
    <text class="chip-text blue-text" x="303" y="386.5" text-anchor="middle">CONTROL ENTRY</text>
    <text class="node-title" x="800" y="384" text-anchor="middle">zloop run → stage</text>
    <text class="node-sub" x="800" y="409" text-anchor="middle">Create durable run state, open a risk-scoped stage, and capture the base reference before dispatch.</text>
  </g>

  <g class="raised"><rect class="box" x="220" y="454" rx="21" ry="21" width="558" height="101"/>
    <text class="eyebrow" x="244" y="480">C2C-P</text><text class="node-title" x="244" y="510">Planning packet</text>
    <text class="node-sub" x="244" y="535">Bounded, redacted plan material and a recorded planning response.</text>
  </g>
  <g class="raised"><rect class="box" x="822" y="454" rx="21" ry="21" width="558" height="101"/>
    <text class="eyebrow" x="846" y="480">WAVE PROPOSAL</text><text class="node-title" x="846" y="510">Packets and scopes</text>
    <text class="node-sub" x="846" y="535">Dependencies, write scopes, acceptance commands, and packet revisions.</text>
  </g>
  <path class="connector-soft" d="M778 504 H822"/>

  <g class="raised"><rect class="amber-card" x="220" y="575" rx="24" ry="24" width="1160" height="106"/>
    <text class="node-title" x="800" y="603" text-anchor="middle">ControlStore and lifecycle guards</text>
    <text class="node-sub" x="800" y="626" text-anchor="middle">SQLite S owns durable state; the supervisor owns one wave loop.</text>
    <g><rect x="247" y="643" width="255" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/><text class="small" x="374.5" y="658" text-anchor="middle">run / stage / packet rows</text>
      <rect x="520" y="643" width="255" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/><text class="small" x="647.5" y="658" text-anchor="middle">revision + launch fence</text>
      <rect x="793" y="643" width="255" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/><text class="small" x="920.5" y="658" text-anchor="middle">owner lock + heartbeat</text>
      <rect x="1066" y="643" width="287" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/><text class="small" x="1209.5" y="658" text-anchor="middle">state transition guards</text>
    </g>
  </g>

  <g class="raised"><rect class="green-card" x="220" y="702" rx="24" ry="24" width="558" height="84"/>
    <rect x="242" y="717" rx="10" ry="10" width="114" height="23" fill="#ebf8f0" stroke="#c3e9d2"/><text class="chip-text green-text" x="299" y="732.5" text-anchor="middle">SUPERVISOR</text>
    <text class="node-title" x="499" y="742" text-anchor="middle">Cold wave supervisor</text><text class="node-sub" x="499" y="765" text-anchor="middle">dependency-aware dispatch with non-blocking poll()</text>
  </g>
  <g class="raised"><rect class="green-card" x="822" y="702" rx="24" ry="24" width="558" height="84"/>
    <rect x="844" y="717" rx="10" ry="10" width="114" height="23" fill="#ebf8f0" stroke="#c3e9d2"/><text class="chip-text green-text" x="901" y="732.5" text-anchor="middle">BACKEND</text>
    <text class="node-title" x="1101" y="742" text-anchor="middle">Worker launch and reports</text><text class="node-sub" x="1101" y="765" text-anchor="middle">launch, collect, accept, and classify retry outcomes</text>
  </g>
  <path class="connector-soft" d="M499 786 V800 H800"/><path class="connector-soft" d="M1101 786 V800 H800"/>

  <g class="raised"><rect class="box" x="220" y="810" rx="22" ry="22" width="1160" height="80"/>
    <text class="node-title" x="800" y="838" text-anchor="middle">One Git worktree per launch</text>
    <text class="node-sub" x="800" y="862" text-anchor="middle">Detached worktree, explicit path scope, delta enumeration, and a durable attempt identity.</text>
  </g>

  <g class="raised"><rect class="violet-card" x="220" y="909" rx="22" ry="22" width="558" height="86"/>
    <text class="node-title" x="499" y="940" text-anchor="middle">Materialize packet</text><text class="node-sub" x="499" y="964" text-anchor="middle">Re-apply the worker delta to private staging before acceptance.</text><text class="node-note" x="499" y="982" text-anchor="middle">candidate commit carries stage and packet identity</text>
  </g>
  <g class="raised"><rect class="red-card" x="822" y="909" rx="22" ry="22" width="558" height="86"/>
    <text class="node-title" x="1101" y="940" text-anchor="middle">Rollback on failed acceptance</text><text class="node-sub" x="1101" y="964" text-anchor="middle">Restore staging to its pre-materialization SHA and contain the failure.</text><text class="node-note" x="1101" y="982" text-anchor="middle">candidate remains evidence when policy requests it</text>
  </g>
  <path class="connector-red" d="M822 952 H760 V850 H700"/><text class="small red-text" x="774" y="938" text-anchor="end">FAIL</text>

  <g class="raised"><rect class="violet-card" x="220" y="1011" rx="22" ry="22" width="558" height="72"/>
    <rect x="242" y="1026" rx="10" ry="10" width="118" height="23" fill="#f2edff" stroke="#d6c8fa"/><text class="chip-text violet-text" x="301" y="1041.5" text-anchor="middle">C2C-A</text>
    <text class="node-title" x="499" y="1040" text-anchor="middle">Result record</text><text class="node-sub" x="499" y="1063" text-anchor="middle">bounded review response recorded against the staged candidate</text>
  </g>
  <g class="raised"><rect class="blue-card" x="822" y="1011" rx="22" ry="22" width="558" height="72"/>
    <text class="node-title" x="1101" y="1040" text-anchor="middle">Promotion readiness</text><text class="node-sub" x="1101" y="1063" text-anchor="middle">stage, packet, evidence, and expected HEAD all agree</text>
  </g>
  <path class="connector-soft" d="M778 1047 H822"/>

  <g class="raised"><rect class="green-card" x="220" y="1098" rx="22" ry="22" width="558" height="66"/>
    <text class="node-title" x="499" y="1125" text-anchor="middle">CAS + git merge --ff-only</text><text class="node-sub" x="499" y="1148" text-anchor="middle">checked-out-safe canonical promotion with no hidden overwrite</text>
  </g>
  <g class="raised"><rect class="box" x="822" y="1098" rx="22" ry="22" width="558" height="66"/>
    <text class="node-title" x="1101" y="1125" text-anchor="middle">Human release authority</text><text class="node-sub" x="1101" y="1148" text-anchor="middle">only a person triggers the final merge or release</text>
  </g>
  <path class="connector-green" d="M1101 1083 V1098 H800"/><path class="connector-green" d="M778 1131 H822"/>

  <g class="raised"><rect class="box" x="220" y="1190" rx="22" ry="22" width="558" height="82"/>
    <text class="node-title" x="499" y="1218" text-anchor="middle">zloop.hook</text><text class="node-sub" x="499" y="1242" text-anchor="middle">bind session and project; capture tool lifecycle events</text><text class="node-note" x="499" y="1261" text-anchor="middle">H0 journal is fail-soft; secrets stay redacted</text>
  </g>
  <g class="raised"><rect class="violet-card" x="822" y="1190" rx="22" ry="22" width="558" height="82"/>
    <text class="node-title" x="1101" y="1218" text-anchor="middle">History and recovery</text><text class="node-sub" x="1101" y="1242" text-anchor="middle">inspect runs, stages, evidence, bindings, and degraded history</text><text class="node-note" x="1101" y="1261" text-anchor="middle">the record explains what happened across failures and restarts</text>
  </g>
  <path class="connector-soft" d="M778 1231 H822"/>

  <line class="hairline" x1="72" y1="1293" x2="1528" y2="1293" opacity=".75"/>
  <text class="foot" x="72" y="1310">ZCode owns the lifecycle and evidence boundary; Git is the physical promotion oracle; the final release remains human-triggered.</text>
</svg>
