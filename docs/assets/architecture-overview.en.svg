<svg id="zloop-overview-en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">ZCode LOOP Orchestra full architecture</title>
  <desc id="desc">From user objective to human merge: the main ZCode agent makes judgments, ZLoop stores state and schedules work, worker agents run in separate workspaces, real evidence and an independent model review the result, and a person releases it.</desc>
  <defs>
    <linearGradient id="overview-glow-en" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="overview-blue-en" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="overview-violet-en" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f0ff"/>
    </linearGradient>
    <filter id="overview-shadow-en" x="-18%" y="-24%" width="136%" height="166%">
      <feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#7a8492" flood-opacity=".11"/>
    </filter>
    <marker id="overview-arrow-en" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#8f98a5"/>
    </marker>
    <marker id="overview-green-arrow-en" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#168a50"/>
    </marker>
    <marker id="overview-red-arrow-en" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#c5413a"/>
    </marker>
  </defs>
  <style>
    #zloop-overview-en{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Arial,sans-serif}
    .page{fill:#f7f7f5}.decor{fill:url(#overview-glow-en)}
    .title{fill:#151619;font-size:42px;font-weight:500;letter-spacing:-1.4px}
    .subtitle{fill:#666a73;font-size:17px;font-weight:400}
    .eyebrow{fill:#989da6;font-size:12px;font-weight:500;letter-spacing:1.8px}
    .promise-title{fill:#151619;font-size:17px;font-weight:500}
    .promise-sub{fill:#7d848e;font-size:11.5px;font-weight:400}
    .stage{fill:#989da6;font-size:11px;font-weight:500;letter-spacing:1.7px}
    .node-title{fill:#151619;font-size:18px;font-weight:500;letter-spacing:-.25px}
    .node-sub{fill:#60656e;font-size:12px;font-weight:400}
    .node-note{fill:#8d949e;font-size:10.8px;font-weight:400}
    .chip-text{font-size:10px;font-weight:500;letter-spacing:.3px}
    .small{fill:#60656e;font-size:10.5px;font-weight:400}
    .foot{fill:#8d949e;font-size:10.5px;font-weight:400}
    .box{fill:#fff;stroke:#d9dce1;stroke-width:1.1;filter:url(#overview-shadow-en)}
    .blue-card{fill:url(#overview-blue-en);stroke:#b9d6ff;stroke-width:1.2;filter:url(#overview-shadow-en)}
    .green-card{fill:#fff;stroke:#c3e9d2;stroke-width:1.2;filter:url(#overview-shadow-en)}
    .amber-card{fill:#fff;stroke:#edd49a;stroke-width:1.2;filter:url(#overview-shadow-en)}
    .violet-card{fill:url(#overview-violet-en);stroke:#d6c8fa;stroke-width:1.2;filter:url(#overview-shadow-en)}
    .red-card{fill:#fff;stroke:#f0beb9;stroke-width:1.2;filter:url(#overview-shadow-en)}
    .connector{fill:none;stroke:#8f98a5;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#overview-arrow-en)}
    .connector-soft{fill:none;stroke:#d9dce1;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
    .connector-green{fill:none;stroke:#168a50;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#overview-green-arrow-en)}
    .connector-red{fill:none;stroke:#c5413a;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#overview-red-arrow-en);stroke-dasharray:6 7}
    .hairline{stroke:#d9dce1;stroke-width:1}
    .blue-text{fill:#1267e5}.green-text{fill:#168a50}.violet-text{fill:#7651c9}.red-text{fill:#c5413a}
  </style>

  <rect class="page" width="1600" height="1320"/>
  <circle class="decor" cx="1492" cy="8" r="260" opacity=".65"/>
  <circle class="decor" cx="94" cy="1260" r="220" opacity=".5"/>

  <text class="eyebrow" x="72" y="54">SYSTEM ARCHITECTURE  /  CONTROL AND RECOVERY</text>
  <text class="title" x="72" y="96">ZCode LOOP Orchestra</text>
  <text class="subtitle" x="72" y="127">A restartable multi-agent workflow for long ZCode jobs—from one goal to a human-approved merge.</text>

  <rect class="box" x="72" y="160" rx="20" width="330" height="84"/>
  <rect x="72" y="160" width="4" height="84" rx="2" fill="#1267e5"/>
  <text class="promise-title" x="96" y="195">Persistent memory</text>
  <text class="promise-sub" x="96" y="220">Recover after context compression, restart, or interruption</text>

  <rect class="box" x="418" y="160" rx="20" width="330" height="84"/>
  <rect x="418" y="160" width="4" height="84" rx="2" fill="#168a50"/>
  <text class="promise-title" x="442" y="195">Isolated parallelism</text>
  <text class="promise-sub" x="442" y="220">Many agents work at once without sharing a writable checkout</text>

  <rect class="box" x="764" y="160" rx="20" width="330" height="84"/>
  <rect x="764" y="160" width="4" height="84" rx="2" fill="#a86d00"/>
  <text class="promise-title" x="788" y="195">Real verification</text>
  <text class="promise-sub" x="788" y="220">Inspect actual changes, file scope, tests, and runtime</text>

  <rect class="box" x="1110" y="160" rx="20" width="418" height="84"/>
  <rect x="1110" y="160" width="4" height="84" rx="2" fill="#151619"/>
  <text class="promise-title" x="1134" y="195">Human release</text>
  <text class="promise-sub" x="1134" y="220">No worker or reviewer can merge by itself</text>

  <line class="hairline" x1="160" y1="286" x2="160" y2="1254"/>
  <circle cx="160" cy="299" r="4" fill="#8f98a5"/>
  <text class="stage" x="72" y="304">GOAL</text>
  <text class="stage" x="72" y="400">DECIDE</text>
  <text class="stage" x="72" y="502">PLAN</text>
  <text class="stage" x="72" y="611">CONTROL</text>
  <text class="stage" x="72" y="728">EXECUTE</text>
  <text class="stage" x="72" y="840">EVIDENCE</text>
  <text class="stage" x="72" y="948">REVIEW</text>
  <text class="stage" x="72" y="1041">INTEGRATE</text>
  <text class="stage" x="72" y="1124">RELEASE</text>
  <text class="stage" x="72" y="1226">RECOVER</text>

  <path class="connector" d="M800 338V356"/>
  <path class="connector" d="M800 431V454"/>
  <path class="connector" d="M800 555V575"/>
  <path class="connector" d="M800 681V702"/>
  <path class="connector" d="M800 786V810"/>
  <path class="connector" d="M800 890V914"/>

  <rect class="box" x="220" y="268" rx="22" width="1160" height="70"/>
  <text class="node-title" x="800" y="296" text-anchor="middle">Human engineering goal</text>
  <text class="node-sub" x="800" y="319" text-anchor="middle">One objective enters the system; final merge and release remain human-triggered.</text>

  <rect class="blue-card" x="220" y="356" rx="24" width="1160" height="75"/>
  <rect x="242" y="371" rx="10" width="122" height="23" fill="#eaf3ff" stroke="#b9d6ff"/>
  <text class="chip-text blue-text" x="303" y="386.5" text-anchor="middle">MAIN AGENT</text>
  <text class="node-title" x="800" y="384" text-anchor="middle">Main ZCode agent</text>
  <text class="node-sub" x="800" y="409" text-anchor="middle">Understands the goal, plans, synthesizes evidence, and resolves uncertainty that truly needs judgment</text>

  <rect class="box" x="220" y="454" rx="21" width="558" height="101"/>
  <text class="eyebrow" x="244" y="480">DECISION</text>
  <text class="node-title" x="244" y="510">Clear work plan</text>
  <text class="node-sub" x="244" y="535">Goal, allowed files, acceptance checks, and risk boundary</text>

  <rect class="box" x="822" y="454" rx="21" width="558" height="101"/>
  <text class="eyebrow" x="846" y="480">TASK GRAPH</text>
  <text class="node-title" x="846" y="510">Dependencies and parallel work</text>
  <text class="node-sub" x="846" y="535">Independent tasks run together; dependent work waits for prerequisites</text>
  <path class="connector-soft" d="M778 504H822"/>

  <rect class="amber-card" x="220" y="575" rx="24" width="1160" height="106"/>
  <text class="node-title" x="800" y="603" text-anchor="middle">Automatic scheduling and state</text>
  <text class="node-sub" x="800" y="626" text-anchor="middle">Code keeps work moving and records what happened. Models handle decisions that need judgment.</text>
  <rect x="247" y="643" width="255" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/>
  <text class="small" x="374.5" y="658" text-anchor="middle">save current state</text>
  <rect x="520" y="643" width="255" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/>
  <text class="small" x="647.5" y="658" text-anchor="middle">start dependency-ready work</text>
  <rect x="793" y="643" width="255" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/>
  <text class="small" x="920.5" y="658" text-anchor="middle">ordinary retry and cancellation</text>
  <rect x="1066" y="643" width="287" height="23" rx="11.5" fill="#fff6de" stroke="#edd49a"/>
  <text class="small" x="1209.5" y="658" text-anchor="middle">reject late or outdated results</text>

  <rect class="green-card" x="220" y="702" rx="24" width="558" height="84"/>
  <rect x="242" y="717" rx="10" width="126" height="23" fill="#ebf8f0" stroke="#c3e9d2"/>
  <text class="chip-text green-text" x="305" y="732.5" text-anchor="middle">WORKER AGENTS</text>
  <text class="node-title" x="499" y="742" text-anchor="middle">Parallel coding agents</text>
  <text class="node-sub" x="499" y="765" text-anchor="middle">One workspace per task; no direct writes to the main branch</text>

  <rect class="green-card" x="822" y="702" rx="24" width="558" height="84"/>
  <rect x="844" y="717" rx="10" width="134" height="23" fill="#ebf8f0" stroke="#c3e9d2"/>
  <text class="chip-text green-text" x="911" y="732.5" text-anchor="middle">RESEARCH AGENTS</text>
  <text class="node-title" x="1101" y="742" text-anchor="middle">Research agents with sources</text>
  <text class="node-sub" x="1101" y="765" text-anchor="middle">Separate workspace, provenance, and untrusted-input handling</text>
  <path class="connector-soft" d="M499 786V810H800"/>
  <path class="connector-soft" d="M1101 786V810H800"/>

  <rect class="box" x="220" y="810" rx="22" width="1160" height="80"/>
  <text class="node-title" x="800" y="838" text-anchor="middle">Recheck the actual result</text>
  <text class="node-sub" x="800" y="862" text-anchor="middle">Changed files + allowed scope + tests + Git state + runtime results — an agent’s self-report is not enough</text>

  <rect class="violet-card" x="420" y="914" rx="24" width="710" height="76"/>
  <rect x="442" y="929" rx="10" width="106" height="23" fill="#f2edff" stroke="#d6c8fa"/>
  <text class="chip-text violet-text" x="495" y="944.5" text-anchor="middle">REVIEWER</text>
  <text class="node-title" x="775" y="943" text-anchor="middle">Independent AI review</text>
  <text class="node-sub" x="775" y="968" text-anchor="middle">Approve · request rework · raise high-risk concern; the reviewer cannot publish</text>

  <rect class="red-card" x="1162" y="909" rx="22" width="218" height="86"/>
  <text class="node-title" x="1271" y="940" text-anchor="middle">High-risk escalation</text>
  <text class="node-sub" x="1271" y="962" text-anchor="middle">Material uncertainty only</text>
  <text class="node-note" x="1271" y="979" text-anchor="middle">returns to the main agent</text>
  <path class="connector-red" d="M1130 951H1162"/>
  <text class="small red-text" x="1146" y="938" text-anchor="middle">ESCALATE</text>
  <path class="connector-red" d="M420 952H264V744H220"/>
  <text class="small red-text" x="276" y="937">REDO</text>

  <path class="connector-green" d="M775 990V1011"/>
  <rect class="green-card" x="220" y="1011" rx="22" width="558" height="72"/>
  <text class="node-title" x="499" y="1040" text-anchor="middle">Safe integration workspace</text>
  <text class="node-sub" x="499" y="1063" text-anchor="middle">Combine accepted changes into one clean candidate</text>

  <rect class="violet-card" x="822" y="1011" rx="22" width="558" height="72"/>
  <text class="node-title" x="1101" y="1040" text-anchor="middle">Final checks</text>
  <text class="node-sub" x="1101" y="1063" text-anchor="middle">Recheck the candidate, repository state, and release conditions</text>
  <path class="connector-green" d="M778 1047H822"/>

  <path class="connector-green" d="M1101 1083V1098H800"/>
  <rect class="box" x="420" y="1098" rx="24" width="710" height="66"/>
  <text class="node-title" x="775" y="1125" text-anchor="middle">A human approves the final merge</text>
  <text class="node-sub" x="775" y="1148" text-anchor="middle">The only authority that can move the candidate into the main branch</text>

  <rect class="box" x="220" y="1190" rx="22" width="558" height="82"/>
  <text class="node-title" x="499" y="1218" text-anchor="middle">Persistent memory</text>
  <text class="node-sub" x="499" y="1242" text-anchor="middle">Captured events, compact checkpoints, and evidence references</text>
  <text class="node-note" x="499" y="1261" text-anchor="middle">survive context compression and restart</text>

  <rect class="violet-card" x="822" y="1190" rx="22" width="558" height="82"/>
  <text class="node-title" x="1101" y="1218" text-anchor="middle">Resume and trace the original record</text>
  <text class="node-sub" x="1101" y="1242" text-anchor="middle">Resume from saved state and inspect original events by evidence reference</text>
  <text class="node-note" x="1101" y="1261" text-anchor="middle">current repository reality always outranks an old summary</text>
  <path class="connector-soft" d="M778 1231H822"/>

  <line class="hairline" x1="72" y1="1293" x2="1528" y2="1293"/>
  <text class="foot" x="72" y="1310">ZCode decides. ZLoop remembers, schedules, checks, and recovers. Agents work separately. A human controls the final merge.</text>
</svg>
