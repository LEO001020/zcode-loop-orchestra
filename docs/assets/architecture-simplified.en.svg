<svg id="zloop-simplified-en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">ZCode LOOP Orchestra: the five-step product flow</title>
  <desc id="desc">A plain-language five-step flow: a user provides a goal, ZCode forms the plan, ZLoop keeps isolated work moving, the host rechecks the result, and a person triggers publication.</desc>
  <defs>
    <filter id="shadow-soft-en" x="-12%" y="-18%" width="124%" height="146%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#728079" flood-opacity=".08"/>
    </filter>
    <marker id="arrow-en" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12Z" fill="#9aa6a0"/>
    </marker>
    <marker id="arrow-green-en" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12Z" fill="#2b8a63"/>
    </marker>
  </defs>
  <style>
    #zloop-simplified-en{font-family:Inter,"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .page{fill:#f7f8f6}.decor{fill:#eef2ef}
    .eyebrow{fill:#8d9892;font-size:12px;font-weight:500;letter-spacing:2px}
    .title{fill:#17201d;font-size:48px;font-weight:500;letter-spacing:-1.8px}
    .subtitle{fill:#5d6a65;font-size:18px;font-weight:400}
    .hero-label{fill:#8d9892;font-size:11px;font-weight:500;letter-spacing:1.7px}
    .hero-title{fill:#17201d;font-size:17px;font-weight:500}
    .rail{fill:#8d9892;font-size:12px;font-weight:500;letter-spacing:1.2px}
    .step-title{fill:#17201d;font-size:22px;font-weight:500;letter-spacing:-.5px}
    .step-body{fill:#5d6a65;font-size:15px;font-weight:400}
    .step-note{fill:#8d9892;font-size:12px;font-weight:400}
    .outcome-title{fill:#17201d;font-size:18px;font-weight:500}
    .outcome-body{fill:#5d6a65;font-size:14px;font-weight:400}
    .foot{fill:#8d9892;font-size:12px;font-weight:400}
    .card{fill:#fff;stroke:#dbe2de;stroke-width:1.2;filter:url(#shadow-soft-en)}
    .card-blue{fill:#f2f6fc;stroke:#c9d8ec;filter:url(#shadow-soft-en)}
    .card-green{fill:#f1f8f4;stroke:#bfdfcc;filter:url(#shadow-soft-en)}
    .card-amber{fill:#fff7e8;stroke:#ecd39e;filter:url(#shadow-soft-en)}
    .card-warm{fill:#fbfcfa;stroke:#d5e2da;filter:url(#shadow-soft-en)}
    .number-blue{fill:#4c76b9}.number-green{fill:#2b8a63}.number-amber{fill:#b37a2c}.number-ink{fill:#53615b}
    .number{fill:#fff;font-size:13px;font-weight:500}
    .hairline{stroke:#dce3df;stroke-width:1}
    .flow{fill:none;stroke:#9aa6a0;stroke-width:1.8;stroke-linecap:round;marker-end:url(#arrow-en)}
    .loop{fill:none;stroke:#2b8a63;stroke-width:2;stroke-linecap:round;stroke-dasharray:8 8;marker-end:url(#arrow-green-en)}
    .loop-label{fill:#2b7659;font-size:13px;font-weight:500}
  </style>

  <rect class="page" width="1600" height="1180"/>
  <circle class="decor" cx="1485" cy="30" r="250" opacity=".8"/>
  <circle class="decor" cx="80" cy="1120" r="190" opacity=".55"/>

  <text class="eyebrow" x="80" y="56">ZLOOP ORCHESTRA  /  PRODUCT IN ONE VIEW</text>
  <text class="title" x="80" y="110">Turn ZCode agent work into a controlled delivery loop</text>
  <text class="subtitle" x="80" y="143">ZCode keeps the reasoning. ZLoop governs execution and recovery. A person keeps release authority.</text>

  <g>
    <rect class="card" x="80" y="178" width="440" height="82" rx="22"/>
    <rect x="80" y="178" width="6" height="82" rx="3" fill="#4c76b9"/>
    <text class="hero-label" x="110" y="207">ZCODE</text>
    <text class="hero-title" x="110" y="235">Understands the goal and makes the plan</text>
  </g>
  <g>
    <rect class="card-green" x="580" y="178" width="440" height="82" rx="22"/>
    <rect x="580" y="178" width="6" height="82" rx="3" fill="#2b8a63"/>
    <text class="hero-label" x="610" y="207">ZLOOP</text>
    <text class="hero-title" x="610" y="235">Keeps work moving and checkable</text>
  </g>
  <g>
    <rect class="card-amber" x="1080" y="178" width="440" height="82" rx="22"/>
    <rect x="1080" y="178" width="6" height="82" rx="3" fill="#b37a2c"/>
    <text class="hero-label" x="1110" y="207">HUMAN</text>
    <text class="hero-title" x="1110" y="235">Decides what may ship</text>
  </g>

  <line class="hairline" x1="182" y1="306" x2="182" y2="1057"/>
  <circle cx="182" cy="320" r="4" fill="#9aa6a0"/>
  <text class="rail" x="80" y="326">INTENT</text>
  <text class="rail" x="80" y="444">PLAN</text>
  <text class="rail" x="80" y="558">EXECUTE</text>
  <text class="rail" x="80" y="672">VERIFY</text>
  <text class="rail" x="80" y="786">RELEASE</text>
  <text class="rail" x="80" y="906">RESULT</text>

  <path class="flow" d="M800 392V408"/>
  <path class="flow" d="M800 506V522"/>
  <path class="flow" d="M800 620V636"/>
  <path class="flow" d="M800 734V750"/>
  <path class="flow" d="M800 848V864"/>

  <g>
    <rect class="card" x="260" y="306" width="1080" height="86" rx="24"/>
    <circle class="number-blue" cx="304" cy="349" r="19"/>
    <text class="number" x="304" y="354" text-anchor="middle">01</text>
    <text class="step-title" x="350" y="344">The user provides a goal</text>
    <text class="step-body" x="350" y="370">A Run and Stage record the objective, baseline, and risk boundary.</text>
    <text class="step-note" x="1240" y="354" text-anchor="end">A traceable run</text>
  </g>

  <g>
    <rect class="card-blue" x="260" y="420" width="1080" height="86" rx="24"/>
    <circle class="number-blue" cx="304" cy="463" r="19"/>
    <text class="number" x="304" y="468" text-anchor="middle">02</text>
    <text class="step-title" x="350" y="458">The root conversation plans</text>
    <text class="step-body" x="350" y="484">It turns the work into bounded packets instead of doing the whole batch.</text>
    <text class="step-note" x="1240" y="468" text-anchor="end">Decision, not batch work</text>
  </g>

  <g>
    <rect class="card-green" x="260" y="534" width="1080" height="86" rx="24"/>
    <circle class="number-green" cx="304" cy="577" r="19"/>
    <text class="number" x="304" y="582" text-anchor="middle">03</text>
    <text class="step-title" x="350" y="572">The control loop keeps going</text>
    <text class="step-body" x="350" y="598">The supervisor starts ready workers and advances the next useful task.</text>
    <text class="step-note" x="1240" y="582" text-anchor="end">Code owns lifecycle state</text>
  </g>

  <g>
    <rect class="card-amber" x="260" y="648" width="1080" height="86" rx="24"/>
    <circle class="number-amber" cx="304" cy="691" r="19"/>
    <text class="number" x="304" y="696" text-anchor="middle">04</text>
    <text class="step-title" x="350" y="686">The result is checked in staging</text>
    <text class="step-body" x="350" y="712">LOOP checks the real delta in staging; failure restores known state and evidence.</text>
    <text class="step-note" x="1240" y="696" text-anchor="end">“Done” ≠ accepted</text>
  </g>

  <g>
    <rect class="card-warm" x="260" y="762" width="1080" height="86" rx="24"/>
    <circle class="number-ink" cx="304" cy="805" r="19"/>
    <text class="number" x="304" y="810" text-anchor="middle">05</text>
    <text class="step-title" x="350" y="800">A person publishes the result</text>
    <text class="step-body" x="350" y="826">Review may block or escalate; only a person runs the final promotion.</text>
    <text class="step-note" x="1240" y="810" text-anchor="end">Human release boundary</text>
  </g>

  <path class="loop" d="M1240 886C1240 942 360 942 360 886"/>
  <rect x="525" y="917" width="550" height="38" rx="19" fill="#f0f8f3" stroke="#c7e2d2"/>
  <text class="loop-label" x="800" y="941" text-anchor="middle">More work remains? Return to step 3. Failure restores known state.</text>

  <text class="eyebrow" x="80" y="1002">THE RESULT  /  WHAT CHANGES FOR YOU</text>
  <line class="hairline" x1="80" y1="1018" x2="1520" y2="1018"/>
  <g>
    <rect class="card" x="80" y="1040" width="440" height="86" rx="22"/>
    <rect x="80" y="1040" width="6" height="86" rx="3" fill="#2b8a63"/>
    <text class="outcome-title" x="110" y="1073">Traceable</text>
    <text class="outcome-body" x="110" y="1101">Runs, stages, packets, and evidence leave a record.</text>
  </g>
  <g>
    <rect class="card" x="580" y="1040" width="440" height="86" rx="22"/>
    <rect x="580" y="1040" width="6" height="86" rx="3" fill="#b37a2c"/>
    <text class="outcome-title" x="610" y="1073">Recoverable</text>
    <text class="outcome-body" x="610" y="1101">Failure, interruption, and stale results stay contained.</text>
  </g>
  <g>
    <rect class="card" x="1080" y="1040" width="440" height="86" rx="22"/>
    <rect x="1080" y="1040" width="6" height="86" rx="3" fill="#4c76b9"/>
    <text class="outcome-title" x="1110" y="1073">Human-controlled release</text>
    <text class="outcome-body" x="1110" y="1101">The system can block or escalate, never publish for you.</text>
  </g>

  <line class="hairline" x1="80" y1="1150" x2="1520" y2="1150"/>
  <text class="foot" x="80" y="1168">In one sentence: ZCode thinks, ZLoop governs the run, and a person decides what enters the canonical branch.</text>
  <text class="foot" x="1520" y="1168" text-anchor="end">Simplified product flow</text>
</svg>
