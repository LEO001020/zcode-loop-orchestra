<svg id="zloop-simple-en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">ZCode LOOP Orchestra simplified architecture</title>
  <desc id="desc">ZCode understands the goal. ZLoop stores state, schedules isolated worker agents, checks real changes, supports independent review and recovery, and leaves the final merge to a person.</desc>
  <defs>
    <linearGradient id="simple-glow-en" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="simple-blue-en" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="simple-violet-en" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f0ff"/>
    </linearGradient>
    <filter id="simple-shadow-en" x="-18%" y="-24%" width="136%" height="166%">
      <feDropShadow dx="0" dy="10" stdDeviation="17" flood-color="#7a8492" flood-opacity=".12"/>
    </filter>
    <marker id="simple-arrow-en" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#8f98a5"/>
    </marker>
  </defs>
  <style>
    #zloop-simple-en{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",Arial,sans-serif}
    .page{fill:#f7f7f5}.decor{fill:url(#simple-glow-en)}
    .title{fill:#151619;font-size:42px;font-weight:500;letter-spacing:-1.3px}
    .subtitle{fill:#666a73;font-size:17px;font-weight:400}
    .eyebrow{fill:#989da6;font-size:12px;font-weight:500;letter-spacing:1.8px}
    .stage{fill:#989da6;font-size:12px;font-weight:500;letter-spacing:1.5px}
    .node-title{fill:#151619;font-size:18px;font-weight:500;letter-spacing:-.25px}
    .node-sub{fill:#5d626b;font-size:12.5px;font-weight:400}
    .section-note{fill:#5d626b;font-size:14px;font-weight:500}
    .foot{fill:#8e959f;font-size:11px;font-weight:400}
    .box{fill:#fff;stroke:#d9dce1;stroke-width:1.1;filter:url(#simple-shadow-en)}
    .blue-card{fill:url(#simple-blue-en);stroke:#b9d6ff;stroke-width:1.2;filter:url(#simple-shadow-en)}
    .green-card{fill:#fff;stroke:#c3e9d2;stroke-width:1.2;filter:url(#simple-shadow-en)}
    .amber-card{fill:#fff;stroke:#edd49a;stroke-width:1.2;filter:url(#simple-shadow-en)}
    .violet-card{fill:url(#simple-violet-en);stroke:#d6c8fa;stroke-width:1.2;filter:url(#simple-shadow-en)}
    .connector{fill:none;stroke:#8f98a5;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#simple-arrow-en)}
    .hairline{stroke:#d9dce1;stroke-width:1}
  </style>

  <rect class="page" width="1600" height="1220"/>
  <circle class="decor" cx="1502" cy="22" r="252" opacity=".65"/>
  <circle class="decor" cx="110" cy="1160" r="210" opacity=".45"/>

  <text class="eyebrow" x="72" y="54">SYSTEM ARCHITECTURE  /  SIMPLIFIED VIEW</text>
  <text class="title" x="72" y="96">ZCode LOOP Orchestra</text>
  <text class="subtitle" x="72" y="127">Give long-running AI coding work persistent memory, parallel agents, trustworthy checks, and safe recovery.</text>

  <line class="hairline" x1="165" y1="198" x2="165" y2="1116"/>
  <circle cx="165" cy="212" r="4" fill="#8f98a5"/>
  <text class="stage" x="78" y="218">GOAL</text>
  <text class="stage" x="78" y="405">PLAN</text>
  <text class="stage" x="78" y="624">WORK</text>
  <text class="stage" x="78" y="847">CHECK</text>
  <text class="stage" x="78" y="1056">MERGE</text>

  <rect class="box" x="250" y="168" rx="24" width="575" height="92"/>
  <text class="node-title" x="278" y="210">User goal</text>
  <text class="node-sub" x="278" y="238">Objective, project directory, constraints, and definition of done</text>

  <rect class="blue-card" x="858" y="168" rx="24" width="492" height="92"/>
  <text class="node-title" x="886" y="210">Main ZCode agent</text>
  <text class="node-sub" x="886" y="238">Understands the problem, plans, and resolves real uncertainty</text>

  <path class="connector" d="M800 286V320"/>
  <text class="section-note" x="800" y="306" text-anchor="middle">↓ One plan becomes work that separate agents can execute</text>

  <rect class="amber-card" x="250" y="355" rx="24" width="350" height="118"/>
  <text class="node-title" x="278" y="405">Task graph</text>
  <text class="node-sub" x="278" y="434">Goals, dependencies, and allowed files</text>

  <rect class="amber-card" x="625" y="355" rx="24" width="350" height="118"/>
  <text class="node-title" x="653" y="405">Automatic task scheduling</text>
  <text class="node-sub" x="653" y="434">Start ready work and handle routine retries</text>

  <rect class="amber-card" x="1000" y="355" rx="24" width="350" height="118"/>
  <text class="node-title" x="1028" y="405">Persistent memory</text>
  <text class="node-sub" x="1028" y="434">Events, checkpoints, and evidence live outside the chat</text>

  <path class="connector" d="M800 500V536"/>
  <text class="section-note" x="800" y="522" text-anchor="middle">↓ Every agent gets a separate workspace; late results cannot overwrite a new plan</text>

  <rect class="green-card" x="250" y="573" rx="24" width="538" height="110"/>
  <text class="node-title" x="278" y="623">Isolated worker agents</text>
  <text class="node-sub" x="278" y="652">Run bounded engineering tasks in parallel without writing the main branch</text>

  <rect class="green-card" x="812" y="573" rx="24" width="538" height="110"/>
  <text class="node-title" x="840" y="623">Research agents with sources</text>
  <text class="node-sub" x="840" y="652">Collect outside facts separately and keep source and time</text>

  <path class="connector" d="M800 708V744"/>
  <text class="section-note" x="800" y="730" text-anchor="middle">↓ Check the real change instead of trusting “I’m done”</text>

  <rect class="violet-card" x="250" y="781" rx="24" width="350" height="126"/>
  <text class="node-title" x="278" y="831">Recheck the actual result</text>
  <text class="node-sub" x="278" y="860">Changed files, allowed scope, tests, and runtime evidence</text>

  <rect class="violet-card" x="625" y="781" rx="24" width="350" height="126"/>
  <text class="node-title" x="653" y="831">Independent AI review</text>
  <text class="node-sub" x="653" y="860">May request rework or raise risk; cannot publish</text>

  <rect class="violet-card" x="1000" y="781" rx="24" width="350" height="126"/>
  <text class="node-title" x="1028" y="831">Failure recovery</text>
  <text class="node-sub" x="1028" y="860">Restore known state while retaining evidence</text>

  <path class="connector" d="M800 934V969"/>

  <rect class="blue-card" x="250" y="992" rx="26" width="1100" height="126"/>
  <text class="node-title" x="280" y="1042">Human-approved final merge</text>
  <text class="node-sub" x="280" y="1071">After every check passes, a person still decides whether the candidate enters the main branch. No agent can publish.</text>

  <line class="hairline" x1="72" y1="1158" x2="1528" y2="1158"/>
  <text class="foot" x="72" y="1186">The main agent decides. ZLoop remembers and schedules. Agents work separately. Real checks and an independent AI review the result. A human merges.</text>
</svg>
